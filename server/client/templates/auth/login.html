{% extends '../base.html' %}
{% load static %}

{% block title%} {{title_page}} {% endblock%}

{% block content%}
    <section class="login-section">
        <div class="container">
            <form class="auth-form" method="POST">
                {% csrf_token %}
                <h1 class="auth-title">Войти</h1>

                <div class="input-block">
                    <label for="login" class="auth-label">Логин:</label>
                    <input type="text" name="login" id="login" class="auth-input" required>
                </div>
                
                <div class="input-block">
                    <label for="password" class="auth-label">Пароль:</label>
                    <input type="password" name="password" id="password" class="auth-input" required>
                </div>

                <button class="auth-button" type="submit">Войти</button>

                <div class="auth-link">Нет аккаунта? <a href="{% url 'register' %}">Зарегестрироваться</a></div>
            </form>
        </div>
    </section>
{% endblock %}
