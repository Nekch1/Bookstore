{% extends './base.html' %}

{% block title %}Подтверждение заказа{% endblock %}

{% block content %}
<section class="confirm-section">
  <div class="container">


    <form id="orderForm" method="post" action="{% url 'create_order' %}" class="order-confirm-form">
      {% csrf_token %}
        <h2>Подтверждение заказа</h2>
        <div>
            <label for="password">Введите пароль для подтверждения покупки:</label>
            <input type="password" name="password" placeholder="Ваш пароль" required class="password-confirm">
            <p id="error-message" style="color:red;"></p>
        </div>
        <button type="submit" class="btn-confirm">Подтвердить заказ</button>
    </form>

  </div>
</section>

<script>
document.getElementById('orderForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = new FormData(form);
  const response = await fetch(form.action, {method: 'POST', body: data});
  const result = await response.json();
  if (result.error) {
    document.getElementById('error-message').innerText = result.error;
  } else {
    window.location.href = '/';
  }
});
</script>

{% endblock %}
